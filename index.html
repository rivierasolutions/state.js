<html lang="en" state-ignore>
    <head>
        <style>.red { color: red; }</style>
    </head>
    <body>
        Hello World! <br>
        <state state-if="@.showMVC2"> MVC 2 </state> <br>
        <br>
        <state state-content="@.showMVC2"></state> <br>
        <state state-if-not="@.showMVC2" state-content="@.someText" state-attr-class="@.buttonClass">Lorem ipsum dolor sit amet</state> <br>
        <input type="text" state-attr-value="@.someText" /> <br>
        <ul>
            <li state-foreach="@.stateArray">
                <state state-content="@.$index"></state>: <state state-content="@.text"></state> <input type="text" state-attr-value="@.text" /> <br>
                <ul>
                    <li state-foreach="@.numberArray" state-attr-class="@.numberClass">
                        <state state-content="@.$index"></state>: <state state-content="@.number"></state>
                        <input type="number" state-attr-value="@.number" /> <br>
                    </li>
                </ul>
                <button state-listen="@.onRemove">Remove</button>
            </li>
        </ul>
        <br>
        <button state-attr-class="@.buttonClass" state-listen="@.onButtonClick">Click me</button>
    </body>
    <script lang="javascript" src="state.js"></script>
    <script lang="javascript">
        document.addEventListener('StateLoaded', () => {

            let number = 0;

            let subState = document.state.subState(document.body);
            subState.update({ 
                stateArray: [ 
                    { text: 'aaa', numberArray: [{ number: 111 }], onRemove: { 'click': removeItem } },
                    { text: 'bbb', numberArray: [{ number: 222, numberClass: 'red' }], onRemove: { 'click': removeItem } }
                ],
                onButtonClick: { 'click': buttonClicked }
            });

            let contract = subState.contract();

            function buttonClicked() {
                subState.update({
                    someText: `Lorem ipsum dolor sit amet ${++number}`,
                    stateArray: subState.current().stateArray.concat([ { 
                        text: 'added',
                        numberArray: [{ number: 303, numberClass: 'red' }, { number: 404 }],
                        onRemove: { 'click': removeItem }
                    }])
                });
            }

            function buttonClicked2() {
                subState.update({
                    someText: `This is a different event listener ${++number}`,
                    stateArray: subState.current().stateArray.concat([ { 
                        text: 'added',
                        numberArray: [{ number: 303, numberClass: 'red' }, { number: 404 }],
                        onRemove: { 'click': removeItem }
                    }])
                });
            }

            function removeItem(event) {
                const toRemove = subState.scopeOf(event.target).$index;
                subState.update({ stateArray: subState.current().stateArray.filter((o,i) => i !== toRemove) });
            }

            setInterval(() => subState.update({ 
                showMVC2: !subState.current().showMVC2,
                buttonClass: subState.current().showMVC2 ? 'red' : '',
                onButtonClick: { 'click': subState.current().showMVC2 ? buttonClicked : buttonClicked2 }
            }), 2000);
        });
    </script>
</html>
