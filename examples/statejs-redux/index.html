<!DOCTYPE html>
<html>
<head>
    <script type="importmap">
    {
        "imports": {
            "@reduxjs/toolkit": "https://esm.sh/@reduxjs/toolkit@2.2.1"
        }
    }
    </script>
    <script src="/dist/state.min.js" defer></script>
    <script type="module" src="store.js" defer></script>
    <script type="module" src="index.controller.js" defer></script>
</head>
<body>
    <div>
        <h1>Counter: <state state-content="@.countDisplay">0</state></h1>
        <progress state-if="@.isLoading"></progress>
        <p>Last change:
            <state state-content="@.timestamp"></state>
            <state state-if-not="@.timestamp">Never</state>
        </p>
        
        <button state-listen="@.onIncrement" state-attr-disabled-if="@.isLoading"> + </button>
        <button state-listen="@.onDecrement" state-attr-disabled-if="@.isLoading"> - </button>
        <br>
        <label>comment: </label><input type="text" state-attr-value="@.comment" state-attr-disabled-if="@.isLoading">
    </div>
</body>
</html>
