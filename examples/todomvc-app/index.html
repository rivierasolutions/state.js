<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Template • TodoMVC</title>
		<link rel="stylesheet" href="node_modules/todomvc-common/base.css">
		<link rel="stylesheet" href="node_modules/todomvc-app-css/index.css">
	</head>
	<body>
		<section class="todoapp">
			<header class="header">
				<h1>todos</h1>
				<input class="new-todo"
					placeholder="What needs to be done?"
					autocomplete="off"
					autofocus
					state-attr-value="$.newTodoName"
					state-listen="$.onNewTodoInput">
			</header>
			<section class="main" state-if="$.todos.length">
				<input id="toggle-all" class="toggle-all" type="checkbox" state-attr-checked-if="$.lastToggleAll">
				<label for="toggle-all" state-listen="$.onToggleAll">Mark all as complete</label>
				<ul class="todo-list">
					<li state-foreach="$.todos" state-class-completed-if="@.isCompleted" state-class-editing-if="@.isEdited">
						<div class="view">
							<input class="toggle" type="checkbox" state-attr-checked-if="@.isCompleted" state-listen="@.onToggle">
							<label state-content="@.content" state-listen="@.onEdit"></label>
							<button class="destroy" state-listen="@.onRemove"></button>
						</div>
						<input class="edit" state-attr-value="@.content" state-listen="@.onEditInput">
					</li>
				</ul>
			</section>
			<footer class="footer" state-if="$.todos.length">
				<span class="todo-count"><strong state-content="$.notCompletedCount">0</strong> 
					<state state-if="$.exacly1NotCompletedItem">item</state>
					<state state-if-not="$.exacly1NotCompletedItem">items</state>
					left</span>
				<!-- Remove this if you don't implement routing -->
				<ul class="filters">
					<li>
						<a class="selected" href="#/">All</a>
					</li>
					<li>
						<a href="#/active">Active</a>
					</li>
					<li>
						<a href="#/completed">Completed</a>
					</li>
				</ul>
				<button class="clear-completed" state-if="$.completedCount" state-listen="$.onClearCompleted">Clear completed</button>
			</footer>
		</section>
		<footer class="info">
			<p>Double-click to edit a todo</p>
			<!-- Change this out with your name and url ↓ -->
			<p>Created by <a href="http://todomvc.com">you</a></p>
			<p>Part of <a href="http://todomvc.com">TodoMVC</a></p>
		</footer>
		<!-- Scripts here. Don't remove ↓ -->
		<script src="node_modules/todomvc-common/base.js"></script>
		<script src="js/state.min.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
